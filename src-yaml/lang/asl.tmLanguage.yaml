# This is the syntax definition source for UEFI ASL files
name: ACPI Source Language(ASL)
scopeName: source.uefi-asl
fileTypes:
  - asl
  - asi

patterns:
  - include: "#comment"
  - include: "#comment_block"
  - include: "#operators"
  - include: "#ascii_string"
  - include: "#hex_numbers"
  - include: "#decimal_numbers"

repository:
  # Component for single-line comments starting with //
  comment:
    match: '//.*$'
    name: comment.line.double-slash.uefi-asl

  # Component for multi-line block comments starting with /* and ending with */
  comment_block:
    begin: '/\*'
    end: '\*/'
    name: comment.block.c.uefi-asl

  # 19.4 ASL Operators Summary
  operators:
    match: '(?i)\b(?:AccessAs|Acquire|Add|Alias|And|ArgX|BankField|Break|BreakPoint|Buffer|Case|Concatenate|ConcatenateResTemplate|CondRefOf|Connection|Continue|CopyObject|CreateBitField|CreateByteField|CreateDWordField|CreateField|CreateQWordField|CreateWordField|DataTableRegion|Debug|Decrement|Default|DefinitionBlock|DerefOf|Device|Divide|DMA|DWordIO|DWordMemory|DWordSpace|EisaId|Else|ElseIf|EndDependentFn|Event|ExtendedIO|ExtendedMemory|ExtendedSpace|External|Fatal|Field|FindSetLeftBit|FindSetRightBit|FixedDMA|FixedIO|Fprintf|FromBCD|Function|GpioInt|GpioIo|I2CSerialBusV2|If|Include|Increment|Index|IndexField|Interrupt|IO|IRQ|IRQNoFlags|LAnd|LEqual|LGreater|LGreaterEqual|LLess|LLessEqual|LNot|LNotEqual|Load|LoadTable|LocalX|LOr|Match|Memory24|Memory32|Memory32Fixed|Method|Mid|Mod|Multiply|Mutex|Name|NAnd|NoOp|NOr|Not|Notify|ObjectType|Offset|One|Ones|OperationRegion|Or|Package|PowerResource|Printf|Processor|QWordIO|QWordMemory|QWordSpace|RawDataBuffer|RefOf|Register|Release|Reset|ResourceTemplate|Return|Revision|Scope|ShiftLeft|ShiftRight|Signal|SizeOf|Sleep|SPISerialbusV2|Stall|StartDependentFn|StartDependentFnNoPri|Store|Subtract|Switch|ThermalZone|Timer|ToBCD|ToBuffer|ToDecimalString|ToHexString|ToInteger|ToPLD|ToString|ToUUID|Unicode|UARTSerialBusV2|VendorLong|VendorShort|Wait|While|WordBusNumber|WordIO|WordSpace|Xor|Zero)\b'
    name: keyword.control.uefi-asl

  # "ASCII string"
  ascii_string:
    match: '"[^"]*"'
    name: string.quoted.double.uefi-asl

  # Hexadecimal numbers (Starts with 0x or 0X)
  hex_numbers:
    match: '\b0[xX][0-9a-fA-F]+\b'
    name: constant.numeric.hex.uefi-asl

  # Decimal numbers (Unsigned integers)
  decimal_numbers:
    match: '\b[0-9]+\b'
    name: constant.numeric.decimal.uefi-asl
